name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 dept/config.py --check
      - run: python3 -c "import pathlib; [compile(p.read_text(), str(p), 'exec') for p in pathlib.Path('dept').glob('*.py')]"
      - run: python3 -m unittest discover -s dept -p 'test_*.py'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, pinned 2026-10-07
        with:
          components: clippy, rustfmt
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Smoke-test daemon startup against legacy agent registry
        # The registry schema must stay backward compatible: feed the freshly
        # built binary a registry in the old on-disk format and assert it
        # starts instead of exiting with "invalid agent registry".
        run: |
          cargo build --locked -p zigzag
          SMOKE_DIR="$(mktemp -d)"
          cp relay-core/tests/fixtures/legacy-events.agents.json "$SMOKE_DIR/events.agents.json"
          printf '{"epoch":"00000000000000000000000000000001","next_sequence":1,"events":[]}' > "$SMOKE_DIR/events.json"
          head -c 48 /dev/urandom | base64 > "$SMOKE_DIR/token"
          chmod 600 "$SMOKE_DIR/token"
          mkdir -p "$SMOKE_DIR/bin"
          printf '#!/bin/sh\necho "127.0.0.2"\n' > "$SMOKE_DIR/bin/tailscale"
          chmod +x "$SMOKE_DIR/bin/tailscale"
          PATH="$SMOKE_DIR/bin:$PATH" ./target/debug/zigzag --secret-file "$SMOKE_DIR/token" --state-file "$SMOKE_DIR/events.json" --port 18923 > "$SMOKE_DIR/out.log" 2>&1 &
          DAEMON_PID=$!
          sleep 4
          if grep -q "invalid agent registry" "$SMOKE_DIR/out.log"; then
            echo "FAIL: daemon rejected the legacy agent registry"
            cat "$SMOKE_DIR/out.log"
            kill "$DAEMON_PID" 2>/dev/null
            exit 1
          fi
          if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
            echo "FAIL: daemon exited during startup"
            cat "$SMOKE_DIR/out.log"
            exit 1
          fi
          echo "OK: daemon started against legacy registry"
          kill "$DAEMON_PID"
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, pinned 2026-10-07
      - run: bash -n scripts/codex-review-launch.sh
      - run: plutil -lint launchd/com.shukantpal.zigzag.plist
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace

      - name: Smoke installed reviewer launcher
        run: |
          install -m 700 scripts/codex-review-launch.sh "$RUNNER_TEMP/codex-review-launch"
          test "$(stat -f %Lp "$RUNNER_TEMP/codex-review-launch")" = 700
          set +e
          "$RUNNER_TEMP/codex-review-launch" invalid "$RUNNER_TEMP"
          status=$?
          set -e
          test "$status" -eq 2
          mkdir "$RUNNER_TEMP/reviewer-task" "$RUNNER_TEMP/reviewer-work"
          printf '%s\n' "$RUNNER_TEMP/reviewer-work" > "$RUNNER_TEMP/reviewer-task/dir.txt"
          printf '%s\n' 'review prompt' > "$RUNNER_TEMP/reviewer-task/prompt.txt"
          printf '%s\n' '{}' > "$RUNNER_TEMP/reviewer-task/result-schema.json"
          printf '%s\n' '[]' > "$RUNNER_TEMP/reviewer-work/review-material.json"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -eu' \
            'output=' \
            'while [ "$#" -gt 0 ]; do' \
            '  if [ "$1" = "-o" ]; then output="$2"; shift 2; else shift; fi' \
            'done' \
            'cat >/dev/null' \
            'printf '\''{"verdict":"approve"}\\n'\'' > "$output"' \
            'printf '\''{"type":"done"}\\n'\''' \
            > "$RUNNER_TEMP/fake-codex"
          chmod 700 "$RUNNER_TEMP/fake-codex"
          grep -q '^CODEX=/run/current-system/sw/bin/codex$' "$RUNNER_TEMP/codex-review-launch"
          ! grep -q 'CODEX_REVIEW_CODEX_BIN' "$RUNNER_TEMP/codex-review-launch"
          sed "s#/run/current-system/sw/bin/codex#$RUNNER_TEMP/fake-codex#" \
            "$RUNNER_TEMP/codex-review-launch" > "$RUNNER_TEMP/codex-review-launch-smoke"
          chmod 700 "$RUNNER_TEMP/codex-review-launch-smoke"
          "$RUNNER_TEMP/codex-review-launch-smoke" run "$RUNNER_TEMP/reviewer-task"
          grep -q '"type":"done"' "$RUNNER_TEMP/reviewer-task/events.jsonl"
          grep -q '"verdict":"approve"' "$RUNNER_TEMP/reviewer-task/last-message.txt"

  release:
    # GitHub exposes macos-14 as the supported ARM64 hosted image, not an
    # immutable image digest. The Actions, toolchain, signed binary, and
    # provenance below are pinned verification boundaries.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, rust]
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, pinned 2026-10-07
        with:
          toolchain: 1.90.0
      - name: Check for Developer ID signing secrets
        id: signing
        env:
          P12: ${{ secrets.ZIGZAG_APPLE_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        # The Developer ID certificate is optional: without it the release
        # still ships, ad-hoc signed, so the self-update pipeline keeps moving.
        if: steps.signing.outputs.available == 'true'
        with:
          p12-file-base64: ${{ secrets.ZIGZAG_APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.ZIGZAG_APPLE_CERTIFICATE_PASSWORD }}
      - name: Build and sign the ARM64 relay
        env:
          SIGNING_IDENTITY: ${{ secrets.ZIGZAG_SIGNING_IDENTITY }}
        run: |
          cargo build --release --locked -p zigzag
          cp target/release/zigzag zigzag-macos-aarch64
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing with the configured Developer ID identity."
            codesign --force --sign "$SIGNING_IDENTITY" \
              --identifier com.shukantpal.zigzag --options runtime --timestamp \
              zigzag-macos-aarch64
          else
            echo "No signing identity configured; ad-hoc signing so the release still ships."
            codesign --force --sign - \
              --identifier com.shukantpal.zigzag \
              zigzag-macos-aarch64
          fi
          codesign --verify --strict --deep --verbose=2 zigzag-macos-aarch64
      - name: Produce release manifest
        id: manifest
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          DIGEST="$(shasum -a 256 zigzag-macos-aarch64 | awk '{print $1}')"
          printf '{"version":"%s","target":"aarch64-apple-darwin","sha256":"%s","commit":"%s"}\n' \
            "$VERSION" "$DIGEST" "$GITHUB_SHA" > zigzag-macos-aarch64.manifest.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: zigzag-macos-aarch64
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          # The updater verifies this before trusting its version or commit.
          subject-path: zigzag-macos-aarch64.manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: Zigzag ${{ steps.manifest.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            zigzag-macos-aarch64
            zigzag-macos-aarch64.manifest.json
