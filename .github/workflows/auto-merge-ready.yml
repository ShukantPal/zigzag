name: Auto-merge ready pull requests

on:
  pull_request:
    types: [labeled]
  check_suite:
    types: [completed]

permissions:
  contents: write
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-merge-ready-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-ready:
    if: github.event_name == 'check_suite' || github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Check eligible pull requests and merge when CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          LABELED_PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_SUITE_PULL_REQUESTS: ${{ toJSON(github.event.check_suite.pull_requests) }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The job-level condition filters unrelated labels; retain this
            # guard so changes to that condition cannot trigger an unintended run.
            [[ "$LABEL_NAME" == "ready" ]] || exit 0
            pr_numbers="$LABELED_PR_NUMBER"
          else
            pr_numbers="$(jq -r '.[].number // empty' <<<"${CHECK_SUITE_PULL_REQUESTS:-[]}")"
          fi

          [[ -n "$pr_numbers" ]] || exit 0

          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue

            pr="$(gh pr view "$pr_number" --json additions,deletions,changedFiles,labels)"
            is_ready="$(jq -r '[.labels[].name] | index("ready") != null' <<<"$pr")"
            [[ "$is_ready" == "true" ]] || continue

            changed_files="$(jq -r '.changedFiles' <<<"$pr")"
            changed_lines="$(jq -r '.additions + .deletions' <<<"$pr")"
            if (( changed_files >= 5 || changed_lines >= 500 )); then
              gh pr edit "$pr_number" --remove-label ready
              gh pr comment "$pr_number" --body \
                "Auto-merge was not enabled: the ready label is limited to PRs changing fewer than 5 files and fewer than 500 total added and deleted lines. This PR changes ${changed_files} files and ${changed_lines} lines."
              continue
            fi

            # Read every check run attached to the PR's current head commit.
            # `gh pr checks --required` only reports branch-protection checks,
            # which can be empty when the repository has no required checks.
            head_sha="$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')"
            set +e
            checks="$(gh api --paginate --slurp "repos/${GH_REPO}/commits/${head_sha}/check-runs" 2>&1)"
            api_status=$?
            set -e
            if [[ "$api_status" -ne 0 ]] || ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$checks"; then
              echo "Could not read check runs for PR #${pr_number}: ${checks}" >&2
              exit 1
            fi

            check_count="$(jq '[.[] | .check_runs[]?] | length' <<<"$checks")"
            if (( check_count == 0 )); then
              echo "No check runs have been reported for PR #${pr_number} yet; waiting."
              continue
            fi

            has_failure="$(jq '[.[] | .check_runs[]?] | any(.status == "completed" and (.conclusion as $conclusion | ["failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure"] | index($conclusion) != null))' <<<"$checks")"
            if [[ "$has_failure" == "true" ]]; then
              gh pr edit "$pr_number" --remove-label ready
              continue
            fi

            has_pending="$(jq '[.[] | .check_runs[]?] | any(.status != "completed" or .conclusion == null)' <<<"$checks")"
            if [[ "$has_pending" == "true" ]]; then
              echo "Check runs are still pending for PR #${pr_number}."
              continue
            fi

            all_green="$(jq '[.[] | .check_runs[]?] | all(.status == "completed" and (.conclusion as $conclusion | ["success", "neutral", "skipped"] | index($conclusion) != null))' <<<"$checks")"
            if [[ "$all_green" == "true" ]]; then
              gh pr merge "$pr_number" --merge
            else
              echo "Check runs are not all complete for PR #${pr_number}; leaving the label in place."
            fi
          done <<<"$pr_numbers"
