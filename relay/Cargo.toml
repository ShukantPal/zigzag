[package]
name = "zigzag"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
keyring = { version = "3.6", features = ["apple-native"] }
libc = "0.2"
regex = "1.12"
relay-core = { path = "../relay-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
ureq = "3"
