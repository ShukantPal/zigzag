[package]
name = "zigzag"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
keyring = { version = "3.6", features = ["apple-native"] }
libc = "0.2"
percent-encoding = "2"
regex = "1.12"
zz = { path = "../zz" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
url = "2"
ureq = { version = "2", features = ["json", "native-certs"] }
log = "0.4"
env_logger = "0.11"
